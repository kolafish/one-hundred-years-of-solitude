<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>马孔多的羊皮纸：百年孤独解谜</title>
  <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
  <link rel="icon" type="image/png" sizes="64x64" href="../assets/favicon.png" />
  <!-- Regenerate from the repository root: npx --yes tailwindcss@3.4.17 --content './macondo-puzzle/*.{html,js}' --output ./macondo-puzzle/tailwind.css --minify -->
  <link rel="stylesheet" href="./tailwind.css" />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --parchment-bg: #f4ebd9;
      --parchment-dark: #e6d6b8;
      --ink-main: #2c1e16;
      --ink-muted: #5c4332;
      --sepia-accent: #8b4513;
      --gold-highlight: #c59b27;
      --crimson-laser: #9e2a2b;
    }

    body {
      font-family: 'Noto Serif SC', Georgia, 'Songti SC', SimSun, serif;
      -webkit-font-smoothing: antialiased;
      background-color: #241912;
      background-image: radial-gradient(circle at 50% 30%, #3a271c 0%, #1c130d 100%);
      color: var(--ink-main);
      margin: 0;
      padding: 0;
      overflow-x: hidden;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    /* 羊皮纸质感容器 */
    .parchment-panel {
      background-color: var(--parchment-bg);
      background-image:
        radial-gradient(rgba(139, 69, 19, 0.08) 1px, transparent 0),
        linear-gradient(135deg, rgba(255,255,255,0.25) 0%, rgba(197,155,39,0.08) 100%);
      background-size: 20px 20px, 100% 100%;
      border: 2px solid #6e472b;
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.55), inset 0 0 24px rgba(139, 69, 19, 0.18);
    }

    .parchment-card {
      background-color: rgba(230, 214, 184, 0.72);
      border: 1.5px solid #8b5a2b;
      transition: transform 0.2s cubic-bezier(0.22, 1, 0.36, 1), border-color 0.2s ease, box-shadow 0.2s ease;
    }

    .parchment-card:hover:not(:disabled) {
      transform: translateY(-2px);
      border-color: var(--gold-highlight);
      box-shadow: 0 4px 12px rgba(139, 69, 19, 0.25);
    }

    .parchment-card.active-skill {
      background-color: #fdf6e7;
      border: 2px solid var(--crimson-laser);
      box-shadow: 0 0 0 3px rgba(158, 42, 43, 0.25);
    }

    /* 自定义滚动条 */
    ::-webkit-scrollbar {
      width: 6px;
    }
    ::-webkit-scrollbar-track {
      background: rgba(139, 69, 19, 0.1);
      border-radius: 4px;
    }
    ::-webkit-scrollbar-thumb {
      background: #8b5a2b;
      border-radius: 4px;
    }

    canvas {
      display: block;
      margin-inline: auto;
      border-radius: 8px;
      box-shadow: inset 0 0 18px rgba(44, 30, 22, 0.35), 0 6px 18px rgba(0, 0, 0, 0.4);
      cursor: pointer;
      touch-action: manipulation;
    }

    .campaign-bar, .loadout-actions {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
    }

    .campaign-button {
      min-height: 42px;
      padding: 6px 12px;
      border: 1px solid #8b5a2b;
      border-radius: 8px;
      background: #ead9ba;
      color: #4a3525;
      font-size: 0.85rem;
    }

    .campaign-button[aria-current="step"], .campaign-button[aria-pressed="true"] {
      border-color: #9e2a2b;
      background: #f7eacb;
      font-weight: 700;
    }

    .campaign-button:disabled { opacity: 0.6; }

    .campaign-status {
      color: #63432f;
      font-size: 0.8rem;
    }

    .board-help, .act-legend {
      padding: 8px 10px;
      border: 1px solid #b79063;
      border-radius: 8px;
      background: #efe1c5;
      color: #4a3525;
      font-size: 0.82rem;
      line-height: 1.5;
    }

    .board-help:empty { display: none; }
    .campaign-bar[hidden] { display: none; }
    .board-help p + p, .act-legend li + li { margin-top: 4px; }
    .act-legend summary { cursor: pointer; font-weight: 700; }

    .loadout-dialog {
      width: min(560px, calc(100% - 24px));
      max-height: 85vh;
      padding: 18px;
      border-radius: 12px;
      color: var(--ink-main);
    }

    .loadout-dialog::backdrop { background: rgb(30 20 13 / 65%); }

    .loadout-options {
      display: grid;
      gap: 8px;
      margin: 12px 0;
    }

    .loadout-options button {
      display: grid;
      grid-template-columns: 28px 1fr;
      align-items: center;
      gap: 8px;
      text-align: start;
    }

    .loadout-options small { display: block; }
  </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center p-2 sm:p-4 md:p-6">

  <!-- 主游戏容器 -->
  <main class="parchment-panel w-full max-w-6xl rounded-xl p-3 sm:p-5 md:p-6 flex flex-col gap-4">

    <!-- 顶部标题栏 -->
    <header class="flex flex-col sm:flex-row sm:items-center justify-between border-b-2 border-[#8b5a2b]/40 pb-3 gap-2">
      <div>
        <a href="../" class="inline-flex items-center min-h-10 text-xs sm:text-sm font-semibold text-[#6e472b] underline underline-offset-2">← 返回首页</a>
        <div class="flex items-center gap-2.5">
          <span class="inline-flex items-center justify-center w-8 h-8 sm:w-9 sm:h-9 shrink-0" data-icon="butterfly"></span>
          <h1 class="text-xl sm:text-2xl md:text-3xl font-bold tracking-wide text-balance text-[#2c1e16]">
            马孔多的羊皮纸 <span class="text-sm sm:text-base font-normal text-[#8b4513]">· 百年孤独机关录</span>
          </h1>
        </div>

        <p id="act-subtitle" class="text-xs sm:text-sm text-[#5c4332] mt-1">
          第一幕：布恩迪亚庄园的烈日与火药 —— 借用家族宿命之力，抵达梅尔基亚德斯的羊皮纸密室
        </p>
      </div>

      <!-- 顶部操作按钮组 -->
      <div class="flex flex-wrap items-center gap-2">
        <div class="px-3 py-1.5 rounded-lg bg-[#e6d6b8] border border-[#8b5a2b] text-xs sm:text-sm font-semibold">
          回合：<span id="turn-count" class="text-[#9e2a2b] font-bold tabular-nums">0</span>
        </div>
        <button id="btn-undo" class="min-h-10 px-3 py-1.5 rounded-lg bg-[#e6d6b8] hover:bg-[#d8c39e] active:scale-[0.96] border border-[#8b5a2b] text-xs sm:text-sm font-semibold transition flex items-center gap-1.5" title="撤销上一步 (Z)">
          <span class="inline-flex w-4 h-4 shrink-0" data-icon="undo"></span>
          <span>撤销一步</span>
        </button>
        <button id="btn-reset" class="min-h-10 px-3 py-1.5 rounded-lg bg-[#e6d6b8] hover:bg-[#d8c39e] active:scale-[0.96] border border-[#8b5a2b] text-xs sm:text-sm font-semibold transition flex items-center gap-1.5" title="重置关卡 (R)">
          <span class="inline-flex w-4 h-4 shrink-0" data-icon="reset"></span>
          <span>重置轮回</span>
        </button>
        <button id="btn-hint" class="min-h-10 px-3 py-1.5 rounded-lg bg-[#c59b27]/25 hover:bg-[#c59b27]/40 active:scale-[0.96] border border-[#c59b27] text-[#5c3a00] text-xs sm:text-sm font-bold transition flex items-center gap-1.5">
          <span class="inline-flex w-4 h-4 shrink-0" data-icon="hint"></span>
          <span>羊皮纸启示</span>
        </button>
        <button id="btn-wait" class="campaign-button" hidden>等待一回合</button>
      </div>
    </header>

    <nav id="campaign-nav" class="campaign-bar" aria-label="马孔多编年史"></nav>
    <p id="campaign-status" class="campaign-status" aria-live="polite" hidden></p>
    <p id="hazard-status" class="campaign-status" aria-live="polite" hidden></p>

    <!-- 核心区域：左侧网格画布 + 右侧状态与能力面板 -->
    <div class="grid grid-cols-1 lg:grid-cols-12 gap-4 items-start">

      <!-- 左侧：画布与操作提示 -->
      <div class="lg:col-span-7 min-w-0 flex flex-col gap-2">
        <div id="canvas-wrapper" class="w-full relative rounded-lg overflow-hidden border-2 border-[#5c3a21] bg-[#e9dcc3]">
          <canvas id="game-canvas"></canvas>

          <!-- 行动模式提示浮条 -->
          <div id="action-banner" class="hidden pointer-events-none absolute top-2 left-1/2 -translate-x-1/2 w-max max-w-[calc(100%-1rem)] px-3.5 py-1.5 rounded-lg bg-[#2c1e16]/92 text-[#f4ebd9] text-center text-xs sm:text-sm font-semibold shadow-lg border border-[#c59b27] z-10 items-center gap-2">
            <span id="action-banner-icon" class="w-5 h-5 shrink-0"></span>
            <span id="action-banner-text">提示文本</span>
          </div>
        </div>

        <!-- 底部图例与移动端方向键 -->
        <div id="board-actions" class="campaign-bar" aria-label="附近可操作机关" hidden></div>
        <div id="tile-inspector" class="board-help"></div>
        <details class="act-legend">
          <summary>本幕机关图例</summary>
          <ul id="act-legend"></ul>
        </details>
        <div class="flex flex-col sm:flex-row items-center justify-between gap-2 bg-[#e6d6b8]/60 p-2.5 rounded-lg border border-[#8b5a2b]/40 text-xs text-[#4a3525]">
          <span>方向键或点邻格移动。悬停或点远处格子可查看说明。</span>
          <!-- 移动端触控十字键 -->
          <div class="flex sm:hidden items-center gap-1.5 mt-1">
            <button data-dir="left" aria-label="向左移动" class="dpad-btn w-10 h-10 rounded-lg bg-[#d8c39e] border border-[#8b5a2b] font-bold active:bg-[#c59b27]">◀</button>
            <button data-dir="up" aria-label="向上移动" class="dpad-btn w-10 h-10 rounded-lg bg-[#d8c39e] border border-[#8b5a2b] font-bold active:bg-[#c59b27]">▲</button>
            <button data-dir="down" aria-label="向下移动" class="dpad-btn w-10 h-10 rounded-lg bg-[#d8c39e] border border-[#8b5a2b] font-bold active:bg-[#c59b27]">▼</button>
            <button data-dir="right" aria-label="向右移动" class="dpad-btn w-10 h-10 rounded-lg bg-[#d8c39e] border border-[#8b5a2b] font-bold active:bg-[#c59b27]">▶</button>
          </div>
        </div>
      </div>

      <!-- 右侧：人物能力行囊 & 羊皮纸编年史 -->
      <div class="lg:col-span-5 flex flex-col gap-3">

        <!-- 家族执念与道具栏 -->
        <div class="bg-[#e6d6b8]/50 rounded-xl p-3 border border-[#8b5a2b]/50">
          <div class="flex items-center justify-between mb-2">
            <h2 class="text-sm sm:text-base font-bold text-[#2c1e16] flex items-center gap-1.5">
              <span class="inline-flex w-5 h-5 shrink-0" data-icon="crest"></span> 家族馈赠（能力与道具）
            </h2>
            <span class="text-xs text-[#6e472b]">靠近人物即可继承执念</span>
          </div>

          <div id="inventory-list" class="flex flex-col gap-2">
            <!-- 动态渲染三张人物能力卡 -->
          </div>
        </div>

        <!-- 羊皮纸编年史（叙事日志） -->
        <div class="bg-[#e6d6b8]/50 rounded-xl p-3 border border-[#8b5a2b]/50 flex flex-col h-52 sm:h-60">
          <div class="flex items-center justify-between mb-1.5">
            <h2 class="text-sm sm:text-base font-bold text-[#2c1e16] flex items-center gap-1.5">
              <span class="inline-flex w-5 h-5 shrink-0" data-icon="quill"></span> 马孔多编年史
            </h2>
            <span class="text-[11px] text-[#8b4513] italic">“家族的第一个人被捆在树上……”</span>
          </div>
          <div id="chronicle-log" class="flex-1 overflow-y-auto pr-1 space-y-2 text-xs sm:text-sm leading-relaxed">
            <!-- 日志条目 -->
          </div>
        </div>

      </div>
    </div>
  </main>

  <!-- 羊皮纸启示（关卡攻略提示）弹窗 -->
  <div id="hint-modal" class="hidden fixed inset-0 bg-black/65 backdrop-blur-sm flex items-center justify-center p-4 z-50">
    <div class="parchment-panel max-w-lg w-full max-h-full overflow-y-auto rounded-xl p-5 sm:p-6 relative">
      <h3 class="text-lg sm:text-xl font-bold text-[#2c1e16] border-b border-[#8b5a2b]/40 pb-2 mb-3 flex items-center gap-2">
        <span class="inline-flex w-6 h-6 shrink-0" data-icon="scroll"></span> 梅尔基亚德斯的羊皮纸启示
      </h3>
      <ol id="act-hints" class="list-decimal list-inside space-y-2 text-xs sm:text-sm text-[#3d291a] leading-relaxed"></ol>
      <div class="mt-5 flex justify-end">
        <button id="btn-close-hint" class="min-h-10 px-4 py-2 rounded-lg bg-[#8b4513] hover:bg-[#6e350d] text-[#f4ebd9] text-sm font-semibold transition">
          合上羊皮纸
        </button>
      </div>
    </div>
  </div>

  <!-- 结局弹窗（通关或陨落） -->
  <div id="end-modal" class="hidden fixed inset-0 bg-black/70 backdrop-blur-sm flex items-center justify-center p-4 z-50">
    <div class="parchment-panel max-w-md w-full max-h-full overflow-y-auto rounded-xl p-6 text-center space-y-4">
      <div id="end-icon" class="flex justify-center"></div>
      <h3 id="end-title" class="text-xl sm:text-2xl font-bold text-[#2c1e16]">破译羊皮纸</h3>
      <p id="end-desc" class="text-xs sm:text-sm text-[#4a3525] leading-relaxed italic">
        叙述文本
      </p>
      <div class="pt-2 flex justify-center gap-3">
        <button id="btn-end-undo" class="min-h-10 px-4 py-2 rounded-lg bg-[#e6d6b8] hover:bg-[#d8c39e] border border-[#8b5a2b] text-sm font-semibold transition flex items-center gap-1.5">
          <span class="inline-flex w-4 h-4 shrink-0" data-icon="undo"></span>
          <span>撤销上一步</span>
        </button>
        <button id="btn-end-restart" class="min-h-10 px-4 py-2 rounded-lg bg-[#8b4513] hover:bg-[#6e350d] text-[#f4ebd9] text-sm font-semibold transition flex items-center gap-1.5">
          <span class="inline-flex w-4 h-4 shrink-0" data-icon="reset"></span>
          <span id="end-action-label">再次踏入马孔多</span>
        </button>
      </div>
    </div>
  </div>

  <dialog id="loadout-dialog" class="loadout-dialog parchment-panel" aria-labelledby="loadout-title">
    <h2 id="loadout-title" class="text-lg font-bold"></h2>
    <p id="loadout-slots" class="campaign-status"></p>
    <ul id="loadout-effects" class="campaign-status"></ul>
    <div id="loadout-options" class="loadout-options" aria-label="布恩迪亚家族图鉴"></div>
    <div class="loadout-actions">
      <button id="loadout-start" class="campaign-button">开始这一幕</button>
      <button id="loadout-cancel" class="campaign-button">返回棋盘</button>
    </div>
  </dialog>

  <script src="../miniprogram/game/icons.js"></script>
  <script src="../miniprogram/game/levels.js"></script>
  <script src="../miniprogram/game/progress.js"></script>
  <script src="../miniprogram/game/macondo.js"></script>
  <script src="./app.js"></script>
</body>
</html>
